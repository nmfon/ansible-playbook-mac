---

# Ansible config
ansible_connection: local

# Python version
python_version: "3.10"


# MacOS defaults
macos_defaults:
  - domain: NSGlobalDomain
    key: AppleShowAllExtensions  # Show all filename extensions in Finder
    type: bool
    value: "true"
  - domain: NSGlobalDomain
    key: NSAutomaticCapitalizationEnabled  # Do not auto-capitalise the first word of each line in Notes, etc.
    type: bool
    value: "false"
  - domain: com.apple.finder
    key: AppleShowAllFiles  # Show dot files in Finder
    type: string
    value: "true"
  - domain: com.apple.screencapture
    key: disable-shadow  # Do not render a shadow/border for screen shots
    type: bool
    value: "true"

# Processes to relauch after configuring MacOS defaults
macos_processes_to_relaunch:
  - Finder
  - SystemUIServer


# Homebrew taps (repos for thrid-party brew formulae)
homebrew_taps:
  - homebrew/cask-fonts
#  - pingidentity/devops  # deprecated
  - pingidentity/tap  # new
  - stax-labs/homebrew-taps

# Homebrew casks (packages for GUI macOS applications)
homebrew_casks:
  - 1password
  - adobe-acrobat-reader  # requires Rosetta 2
  - beyond-compare
  - box-sync
  - docker
  - font-meslo-for-powerline # requires homebrew tap "homebrew/cask-fonts"
  - google-chrome
  - iterm2
  - kindle
  - kitematic
  - microsoft-office
  - microsoft-remote-desktop
  - microsoft-teams  # requires Rosetta 2
  - openconnect-gui
  - postman
  - skype-for-business  # requires Rosetta 2
  - slack
#  - spectacle  # install broken
  - utm
  - vagrant
#  - virtualbox  # requires an Intel processor (it's an x86 hypervisor, not an emulator)... use utm instead
  - visual-studio-code
  - vlc
  - zoom

# Homebrew formulae (packages for command-line macOS applications)
homebrew_formulae:
  - bash
  - bmon
  - composer
  - coreutils
  - eksctl
  - git
  - gnu-tar
  - gnupg
  - go
  - gradle
  - groovy
  - helm
  - jq
  - k9s
  - kubectl
  - kubectx
  - kustomize
  - maven
  - minikube
  - node
  - openjdk
  - packer
  - pass
#  - ping-devops  # deprecated (supports bash)
  - pingctl  # new (supports zsh)
  - podman
  - saml2aws
  - shellcheck
  - sshuttle
  - stax2aws
  - telnet
  - terraform
  - tree
  - watch
  - wget


# Node.js packages
nodejs_packages:
  - newman
  - newman-reporter-html


# Python packages
pip_packages:
  - setuptools      # Version bundled with Mac OS is very old
  - six             # Version bundled with Mac OS is very old
  - ansible         # Ansible docs recommend installation via pip
  - ansible-lint
  - awscli
  - aws-ssm-copy
  - boto
  - boto3
  - cfn-lint
  - cfn_flip
  - docker
  - jinja2
  - pylint
  - pyOpenSSL       # Required by awscli, per https://github.com/aws/aws-cli/issues/4708
  - PyYAML
  - shyaml
  - virtualenv


# Visual Studio Code extensions
vscode_extensions:
  - name: CloudFormation Linter
    id:   kddejong.vscode-cfn-lint
  - name: Diff
    id:   fabiospampinato.vscode-diff
  - name: Docker
    id:   ms-azuretools.vscode-docker
  - name: Excel Viewer
    id:   grapecity.gc-excelviewer
  - name: GitLens
    id:   eamodio.gitlens
  - name: HashiCorp Terraform
    id:   hashicorp.terraform
  - name: Instant Markdown
    id:   dbankier.vscode-instant-markdown
  - name: Jenkinsfile Support
    id:   ivory-lab.jenkinsfile-support
  - name: Jinja
    id:   wholroyd.jinja
  - name: Markdownlint
    id:   davidanson.vscode-markdownlint
  - name: Material Icon Theme
    id:   pkief.material-icon-theme
  - name: Maven for Java
    id:   vscjava.vscode-maven
  - name: MySQL Syntax
    id:   jakebathman.mysql-syntax
  - name: Python
    id:   ms-python.python
  - name: Read-Only Indicator
    id:   alefragnani.read-only-indicator
  - name: ShellCheck
    id:   timonwong.shellcheck
  - name: TODO Highlight
    id:   wayou.vscode-todo-highlight
  - name: XML Tools
    id:   dotjoshjohnson.xml
  - name: YAML
    id:   redhat.vscode-yaml
