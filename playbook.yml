---

- hosts: all
  tasks:

# Shell config

  - name: template .bash_profile
    template:
      src: templates/bash/bash_profile
      dest: $HOME/.bash_profile
      mode: 0644

  - name: template .zshrc
    template:
      src: templates/zsh/zshrc
      dest: $HOME/.zshrc
      mode: 0644

# OS packages

  - name: update homebrew
    homebrew:
      update_homebrew: yes

  - name: add homebrew taps (repos)
    homebrew_tap:
      name: "{{ item }}"
      state: present
    loop: "{{ homebrew_taps }}"

  - name: install homebrew formulae (packages)
    package:
      name: "{{ item }}"
      state: latest
    loop: "{{ homebrew_formulae }}"

# Python packages

  - name: install python packages
    pip:
      name: "{{ item }}"
      extra_args: "--upgrade --user"
    loop: "{{ pip_packages }}"

# Application config

  - name: create .aws/ diretory
    file:
      path: $HOME/.aws/
      state: directory
      mode: 0755

  - name: template .aws/config
    template:
      src: templates/aws/config
      dest: $HOME/.aws/config
      mode: 0644

  - name: configure git core.pager
    command: git config --global core.pager "less -F -X"

  - name: configure git pull.ff
    command: git config --global pull.ff "only"

  - name: configure git push.default
    command: git config --global push.default "current"

  - name: configure git remote.origin
    command: git config --global remote.origin.prune "true"

  - name: template .saml2aws
    template:
      src: templates/saml2aws/saml2aws
      dest: $HOME/.saml2aws
      mode: 0644

  - name: template vscode settings.json
    template:
      src: templates/vscode/settings.json
      dest: "$HOME/Library/Application Support/Code/User/settings.json"
      mode: 0644

  - name: template vscode tasks.json
    template:
      src: templates/vscode/tasks.json
      dest: "$HOME/Library/Application Support/Code/User/tasks.json"
      mode: 0644

# Visual Studio Code extensions

  - name: install vscode extensions
    command: code --install-extension {{ item.id}}
    loop: "{{ vscode_extensions }}"
    loop_control:
      label: "{{ item.name }}"
